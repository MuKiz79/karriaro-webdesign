<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 40" width="280" height="40" role="img" aria-label="Karriaro Webdesign-Manufaktur">
  <defs>
    <style type="text/css">
      .name { font-family: 'Cormorant Garamond', 'Times New Roman', serif; font-weight: 500; font-size: 14px; letter-spacing: 1.68px; fill: #14202B; text-transform: uppercase; }
      .sub { font-family: 'Inter', -apple-system, sans-serif; font-weight: 500; font-size: 7px; letter-spacing: 1.82px; fill: #525E6B; text-transform: uppercase; }
      .dot { fill: #1A2E40; font-weight: 600; }
      .letter { font-family: 'Cormorant Garamond', 'Times New Roman', serif; font-weight: 600; font-size: 19px; fill: #14202B; letter-spacing: -0.025em; }
      .bracket { fill: none; stroke: #14202B; stroke-width: 1.2; }
      .divider { stroke: #14202B; stroke-width: 0.6; }
    </style>
  </defs>
  <!-- Linker Bracket -->
  <path class="bracket" d="M 9 8 L 4 8 L 4 32 L 9 32"/>
  <!-- Rechter Bracket -->
  <path class="bracket" d="M 28 8 L 33 8 L 33 32 L 28 32"/>
  <!-- K mittig -->
  <text class="letter" x="18.5" y="26" text-anchor="middle">K</text>
  <!-- Trennlinie -->
  <line class="divider" x1="44" y1="10" x2="44" y2="30"/>
  <!-- Wortmarke -->
  <text class="name" x="54" y="19">Karriaro</text>
  <!-- Sublabel -->
  <text class="sub" x="54" y="31">Webdesign<tspan class="dot" dx="2.5" dy="0">·</tspan><tspan dx="2.5" dy="0">Manufaktur</tspan></text>
</svg>
