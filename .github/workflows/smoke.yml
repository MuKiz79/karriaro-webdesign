name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  relaunch:
    name: Designmanufaktur – routes and interaction tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: relaunch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: relaunch/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: python3 deploy-live.py
      - name: Verify committed production build
        run: git diff --exit-code -- site dist-live

  audit-tests:
    name: Cloud-Function Unit-Tests (126 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: cd functions && npm ci

      - name: Run Cloud-Function tests (test:audit — komplette Suite)
        run: npm run test:audit

  unit:
    name: lead-intelligence Vitest (304 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lead-intelligence/package-lock.json

      - name: Install dependencies
        run: cd lead-intelligence && npm install --no-audit --no-fund

      - name: Run vitest
        run: cd lead-intelligence && npm test
